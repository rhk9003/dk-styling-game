<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DK AI 穿搭選鞋遊戲 — 91APP 嵌入範例</title>
    <style>
      body { margin: 0; background: #f5f8f6; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
      .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-size: 1.2rem; }
      p { color: #697177; line-height: 1.6; }
      code { background: #fff; border: 1px solid #dfe6e2; border-radius: 4px; padding: 2px 6px; }
      /* 嵌入用 iframe：寬度滿版，高度由子頁 postMessage 自動調整 */
      #dk-styling { width: 100%; border: 0; display: block; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>DK AI 穿搭選鞋遊戲 — 嵌入預覽</h1>
      <p>
        下方是實際嵌入效果。把 <code>&lt;iframe&gt;</code> 與後面那段
        <code>&lt;script&gt;</code> 一起貼到 91APP 的自訂 HTML 區塊即可，
        iframe 會依內容自動長高，不會出現內部捲軸或被裁切。
      </p>

      <!-- ↓↓↓ 這段就是貼到 91APP 的內容 ↓↓↓ -->
      <iframe
        id="dk-styling"
        src="https://rhk9003.github.io/dk-styling-game/"
        title="DK AI 穿搭選鞋遊戲"
        loading="lazy"
        scrolling="no"
        height="2200"
        allow="clipboard-write"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
      <script>
        (function () {
          var frame = document.getElementById("dk-styling");
          window.addEventListener("message", function (event) {
            if (event.origin !== "https://rhk9003.github.io") return;
            var data = event.data || {};
            if (data.type === "dk-styling-embed:height" && typeof data.height === "number") {
              frame.style.height = data.height + "px";
            }
          });
        })();
      </script>
      <!-- ↑↑↑ 這段就是貼到 91APP 的內容 ↑↑↑ -->
    </div>
  </body>
</html>
