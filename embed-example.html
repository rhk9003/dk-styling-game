<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DK AI 穿搭選鞋遊戲 — 91APP 嵌入範例</title>
    <style>
      body { margin: 0; background: #f5f8f6; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
      .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-size: 1.2rem; }
      p { color: #697177; line-height: 1.6; }
      code { background: #fff; border: 1px solid #dfe6e2; border-radius: 4px; padding: 2px 6px; }
      /* 嵌入用 iframe：寬度滿版、固定高度（不含任何 script） */
      #dk-styling { width: 100%; border: 0; display: block; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>DK AI 穿搭選鞋遊戲 — 嵌入預覽</h1>
      <p>
        下方是實際嵌入效果。只要把 <code>&lt;iframe&gt;</code> 這段貼到 91APP 的自訂 HTML
        區塊即可，<strong>不需要任何 script</strong>。高度用固定的
        <code>3200</code>（實測手機最高約 3167px 再加緩衝），確保結果圖不會被裁切。
      </p>

      <!-- ↓↓↓ 這段就是貼到 91APP 的內容 ↓↓↓ -->
      <iframe
        id="dk-styling"
        src="https://rhk9003.github.io/dk-styling-game/"
        title="DK AI 穿搭選鞋遊戲"
        height="3200"
        scrolling="no"
        loading="lazy"
      ></iframe>
      <!-- ↑↑↑ 這段就是貼到 91APP 的內容 ↑↑↑ -->

      <p>
        取捨：使用者還沒選鞋時，下方會有一段留白（預留結果圖的高度）。若想省留白，
        可把 <code>height</code> 改小（例如 <code>900</code>）並改 <code>scrolling="auto"</code>，
        讓使用者在框內捲動。
      </p>
    </div>
  </body>
</html>
